{% extends "templates/web.html" %}

{% block title %}Payment Error{% endblock %}

{% block page_content %}
<div class="container">
    <div class="row">
        <div class="col-md-8 col-md-offset-2">
            <div class="text-center">
                <div class="alert alert-danger">
                    <h3><i class="fa fa-times-circle"></i> Payment Error</h3>
                    <p>We could not process your payment. Please try again.</p>
                    {% if payment_reference %}
                    <p><strong>Reference:</strong> {{ payment_reference }}</p>
                    {% endif %}
                </div>
                <a href="javascript:history.back()" class="btn btn-default">Go Back</a>
                <a href="/" class="btn btn-primary">Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
